# Runs on every pull request and every push to main. All jobs must pass before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the previous push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 15 # the concurrency tests must never hang a run for hours
    strategy:
      matrix:
        java: ['21', '25'] # 21: the release level we promise; 25: the JDK the team develops on
    steps:
      # Actions are pinned to commit SHAs (a tag can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: mvn verify (tests, coverage floor, Spotless formatting, SpotBugs + FindSecBugs)
        # Static checks (Spotless, SpotBugs) give the same result on any JDK, so they run on 21 only.
        run: ./mvnw -B -ntp verify ${{ matrix.java != '21' && '-Dspotless.check.skip=true -Dspotbugs.skip=true' || '' }}

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz. Hard-coded so a swapped release asset is rejected.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the latest commit
      - name: Install gitleaks
        run: |
          file=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$file"
          echo "${GITLEAKS_SHA256}  $file" | sha256sum -c -
          tar -xzf "$file" gitleaks
      - name: Scan every commit for secrets
        run: ./gitleaks git --redact --verbose .
