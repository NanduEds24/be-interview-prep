spring.application.name=app

# In-memory H2 database: starts empty on every restart. Load demo data from data.sql if needed.
spring.datasource.url=jdbc:h2:mem:appdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# H2 console: off by default, because it is public and gives full SQL access (including making any user ADMIN).
# For local debugging only, set H2_CONSOLE_ENABLED=true, then open http://localhost:8080/h2-console
# (JDBC URL jdbc:h2:mem:appdb, user sa, no password).
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

# Secrets come from environment variables only; nothing is hard-coded.
# JWT_SECRET: HMAC key, at least 32 bytes. If unset, a random key is generated on each start (dev only).
app.jwt.secret=${JWT_SECRET:}
# Optional first admin account, created at startup when both are set.
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
# Users live in our database; turn off Spring's default in-memory user with a generated password.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Behind a reverse proxy / TLS terminator, build URLs (e.g. Q2's shortUrl) from X-Forwarded-* headers
# instead of the internal host. Off by default: clients could spoof these headers. Set
# FORWARD_HEADERS_STRATEGY=framework only when a proxy in front always overwrites them.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
