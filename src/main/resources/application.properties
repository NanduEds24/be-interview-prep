spring.application.name=app

# In-memory H2 database: starts empty on every restart. Load demo data from data.sql if needed.
spring.datasource.url=jdbc:h2:mem:appdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

# Browse the database at http://localhost:8080/h2-console (JDBC URL jdbc:h2:mem:appdb, user sa, no password).
spring.h2.console.enabled=true
